<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FIZL0 Apps</title>
<link rel="icon" href="https://avatars.githubusercontent.com/u/48865825?v=4">
<link rel="apple-touch-icon" href="https://avatars.githubusercontent.com/u/48865825?v=4">
<meta name="description" content="Add the FIZL0 source to iFizBox, Feather, AltStore or SideStore to install and update every FIZL0 iPhone / iPad app.">
<style>
  :root {
    --bg: #f2f4f7; --card: #fff; --ink: #14171c; --muted: #5d6573; --line: rgba(20,23,28,.08);
    --accent: #1c8cda; --accent-deep: #1d5488; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0e1116; --card: #191d24; --ink: #eef1f5; --muted: #98a1ae; --line: rgba(255,255,255,.08); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0e1116; --card: #191d24; --ink: #eef1f5; --muted: #98a1ae; --line: rgba(255,255,255,.08); color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  header img { width: 60px; height: 60px; border-radius: 50%; box-shadow: 0 0 0 1px var(--line); }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.02em; line-height: 1.15; }
  h2 { margin: 28px 4px 10px; font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  p { margin: 4px 0 0; }
  .muted { color: var(--muted); font-size: .9rem; }
  .card { background: var(--card); border-radius: 18px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 0 0 1px var(--line); }
  .hero { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; text-decoration: none; color: #fff;
          background: linear-gradient(135deg, var(--accent), var(--accent-deep)); box-shadow: 0 6px 18px rgba(28,140,218,.3); }
  .hero img { width: 48px; height: 48px; border-radius: 11px; flex: none; }
  .hero b { display: block; font-size: 1.05rem; }
  .hero span { font-size: .85rem; opacity: .85; }
  .hero::after { content: "›"; margin-left: auto; font-size: 1.8rem; line-height: 1; opacity: .8; }
  .hero:active, .btn:active { transform: scale(.98); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .btn { display: block; padding: .7em .4em; border-radius: 12px; border: 0; background: var(--bg); color: var(--accent);
         font: 600 .92rem/1.2 inherit; font-family: inherit; text-align: center; text-decoration: none; cursor: pointer; transition: transform .1s; }
  .url { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 4px 4px 4px 12px; border-radius: 12px; background: var(--bg); }
  .url code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .82rem; color: var(--muted); }
  .url .btn { flex: none; padding: .55em .9em; background: var(--card); }
  .apps { list-style: none; margin: 0; padding: 0 16px; }
  .apps li { display: flex; gap: 14px; align-items: center; padding: 14px 0; }
  .apps li + li { border-top: 1px solid var(--line); }
  .apps img { width: 60px; height: 60px; border-radius: 14px; flex: none; box-shadow: 0 0 0 1px var(--line); background: var(--bg); }
  .apps .name { font-weight: 600; }
  .apps .meta { font-size: .8rem; color: var(--muted); margin-top: 2px; }
  .tag { display: inline-block; padding: 1px 7px; margin-right: 6px; border-radius: 6px; font-size: .75rem; font-weight: 600; color: #fff; }
  footer { margin: 20px 4px 0; }
</style>
</head>
<body>
<main>
  <header>
    <img src="https://avatars.githubusercontent.com/u/48865825?v=4" alt="">
    <div><h1>FIZL0 Apps</h1><p class="muted">Open remasters for iPhone &amp; iPad</p></div>
  </header>

  <div class="card">
    <a class="hero" id="ifizbox">
      <img src="https://ifizbox.com/icons/icon-180.png" alt="">
      <div><b>Add to iFizBox</b><span>Get every app below, with updates</span></div>
    </a>
    <div class="row">
      <a class="btn" id="feather">Feather</a>
      <a class="btn" id="altstore">AltStore</a>
      <a class="btn" id="sidestore">SideStore</a>
    </div>
    <div class="url"><code id="url"></code><button class="btn" id="copy" type="button">Copy</button></div>
  </div>

  <h2>Apps</h2>
  <ul class="apps card" id="apps"></ul>

  <footer class="muted">Nothing happens when you tap? Open this page in Safari on the iPhone with the app installed,
    or copy the URL and add it under Sources in the app.</footer>
</main>
<script>
  const src = new URL('source.json', location.href).href;
  const q = encodeURIComponent(src);
  const $ = (id) => document.getElementById(id);
  $('url').textContent = src;
  // The installed app only answers cydian:// (no universal links yet). Try it; if Safari never went to the
  // background, iFizBox isn't installed: open ifizbox.com's Home, which offers to install it (?install).
  $('ifizbox').href = 'https://ifizbox.com/?install';
  $('ifizbox').onclick = (e) => {
    e.preventDefault();
    let left = false;
    const away = () => { left = true; };
    addEventListener('pagehide', away, { once: true });
    document.addEventListener('visibilitychange', () => { if (document.hidden) left = true; }, { once: true });
    location.href = 'cydian://add?url=' + q;
    setTimeout(() => { if (!left && !document.hidden) location.href = $('ifizbox').href; }, 1500);
  };
  $('feather').href = 'feather://source/' + src;
  $('altstore').href = 'altstore://source?url=' + q;
  $('sidestore').href = 'sidestore://source?url=' + q;
  $('copy').onclick = () => navigator.clipboard.writeText(src).then(() => { $('copy').textContent = 'Copied'; },
    () => getSelection().selectAllChildren($('url')));
  const mb = (n) => n ? (n / 1e6).toFixed(n < 1e8 ? 1 : 0) + ' MB' : '';
  fetch('source.json').then(r => r.json()).then(s => {
    for (const a of s.apps) {
      const li = document.createElement('li');
      li.innerHTML = '<img alt="" loading="lazy"><div><div class="name"></div><div class="muted"></div><div class="meta"><span class="tag"></span><span></span></div></div>';
      li.querySelector('img').src = a.iconURL;
      li.querySelector('.name').textContent = a.name;
      li.querySelector('.muted').textContent = a.subtitle || '';
      const tag = li.querySelector('.tag');
      tag.textContent = 'v' + a.version; tag.style.background = a.tintColor || 'var(--accent)';
      tag.nextSibling.textContent = [mb(a.size), a.versions?.[0]?.minOSVersion && 'iOS ' + a.versions[0].minOSVersion + '+'].filter(Boolean).join(' · ');
      $('apps').append(li);
    }
  }).catch(() => {});
</script>
</body>
</html>
