name: source
on:
  push: { branches: [main] }
  schedule: [{ cron: '17 * * * *' }]  # ponytail: hourly poll; apps' release scripts also kick it with `gh workflow run`
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh _site
      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v4
        id: deploy
        continue-on-error: true
      # GitHub sometimes can't see the artifact it just uploaded ("No artifacts named github-pages"): wait, try again
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
